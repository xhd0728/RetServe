[project]
name = "retserve"
version = "0.1.0"
description = "A compact FAISS-backed retrieval service for OpenAI-compatible embeddings."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [
  { name = "Haidong Xin" }
]
dependencies = [
  "faiss-gpu-cu12[fix-cuda]>=1.14.1.post1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "faiss-cpu>=1.14.2; sys_platform != 'linux' or platform_machine != 'x86_64'",
  "numpy>=1.21.0",
  "jsonlines>=3.1.0",
  "tqdm>=4.65.0",
  "orjson>=3.9.0",
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
  "uvloop>=0.19.0; sys_platform != 'win32'",
  "httptools>=0.6.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "openai>=1.0.0",
  "httpx[socks]>=0.23.0",
  "typing-extensions>=4.6.0",
  "requests>=2.31.0",
  "aiohttp>=3.14.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff>=0.15.16,<0.16.0",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
