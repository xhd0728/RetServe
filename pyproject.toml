[project]
name = "retserve"
version = "0.1.0"
description = "A compact FAISS-backed retrieval service for OpenAI-compatible embeddings."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [
  { name = "Haidong Xin" }
]
dependencies = [
  "faiss-cpu>=1.7.4",
  "numpy>=1.21.0",
  "jsonlines>=3.1.0",
  "tqdm>=4.65.0",
  "orjson>=3.9.0",
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
  "uvloop>=0.19.0; sys_platform != 'win32'",
  "httptools>=0.6.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "openai>=1.0.0",
  "typing-extensions>=4.6.0",
  "requests>=2.31.0",
  "aiohttp>=3.9.0",
]

[tool.uv]
package = false
