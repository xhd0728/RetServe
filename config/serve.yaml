# Serving Configuration
server:
  host: "0.0.0.0"
  port: 8088

index:
  path: "./data/example_faiss.index"
  use_gpu: false
  gpu_ids: "0"
  search_workers: 128
  omp_threads: null

data:
  corpus_path: "./data/example_corpus.jsonl"

embedding:
  url: "http://localhost:8000/v1"
  model: "qwen3-embedding-0.6b"
  api_key: "None"
  api_key_env: "RET_SERVE_EMBED_API_KEY"
  batch_size: 128
  concurrency_limit: 32
  request_timeout: 60.0
  max_retries: 2
  normalize: true

metrics:
  enabled: true
